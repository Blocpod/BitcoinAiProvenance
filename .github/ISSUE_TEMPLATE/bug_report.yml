name: Bug report
description: Report reproducible protocol or implementation behavior.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private keys, RPC credentials, proprietary artifacts, or personal data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproducer and exact commands.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.x.x
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security or compatibility impact
      description: Note any effect on signatures, identifiers, policies, artifacts, batches, or anchors.
